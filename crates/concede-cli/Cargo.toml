[package]
name = "concede-cli"
description = "Concede command line interface and MCP server for agents."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "concede"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.9", features = ["derive"] }
concede-core.workspace = true
rmcp = { version = "3.11.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"

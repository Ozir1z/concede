[workspace]
resolver = "3"
members = ["crates/torch-core", "crates/torch-cli", "crates/torch-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
torch-core = { path = "crates/torch-core" }

# GPUI is pinned to a Zed commit; see docs/decisions/0002-gpui-dependency.md.
# Bump both together, and update rust-toolchain.toml to match Zed's at that commit.
gpui = { git = "https://github.com/zed-industries/zed", rev = "c016f436e60bfa5105de53837935e9de94eb0867" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "c016f436e60bfa5105de53837935e9de94eb0867", features = ["font-kit", "wayland", "x11"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev]
# GPUI is large; optimise dependencies a little so the app is usable in debug builds.
[profile.dev.package."*"]
opt-level = 1
